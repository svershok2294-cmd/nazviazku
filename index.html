<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>На Зв'язку</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #e9efe7;
            --card-bg: #ffffff;
            --text-color: #222222;
            --primary-color: #3b6998;
            --border-color: #d1d8e0;
        }

        body.dark-mode {
            --bg-color: #18222d;
            --card-bg: #212d3b;
            --text-color: #f5f5f5;
            --primary-color: #5288c1;
            --border-color: #2b394a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--primary-color);
            color: white;
            padding: 12px 16px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar-container {
            position: relative;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            object-fit: cover;
            background: #3b6998;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 12px;
            margin-top: 5px;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .tab-btn.active {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        textarea, input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--card-bg);
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .post-actions {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: var(--primary-color);
            cursor: pointer;
            font-weight: bold;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="header">
        <h2>На Зв'язку 🇺🇦</h2>
        <button class="btn btn-sm" onclick="toggleTheme()">🌗 Тема</button>
    </div>

    <div class="nav-tabs">
        <div class="tab-btn active" onclick="switchTab('feed')">📰 Стіна</div>
        <div class="tab-btn" onclick="switchTab('friends')">👥 Друзі (0)</div>
    </div>

    <div id="tab-feed">
        <div class="card">
            <div class="profile-info">
                <div class="avatar-container">
                    <img id="user-avatar-img" class="avatar hidden" src="" alt="Avatar">
                    <div id="user-avatar-placeholder" class="avatar">V</div>
                </div>
                <div>
                    <h3 id="user-name" style="margin:0;">Vladyslav Svershok</h3>
                    <p style="margin:3px 0; color: gray; font-size: 13px;">Засновник (ID #1)</p>
                    <button class="btn btn-sm" onclick="changeAvatar()">📷 Змінити фото</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h4>Створити допис</h4>
            <textarea id="post-input" rows="3" placeholder="Що у вас нового?"></textarea>
            <button class="btn" style="width: 100%;" onclick="createPost()">Опублікувати</button>
        </div>

        <div id="posts-container"></div>
    </div>

    <div id="tab-friends" class="card hidden">
        <h3>Ваші друзі</h3>
        <p style="color: gray;">У вас поки немає доданих друзів.</p>
        <button class="btn" onclick="alert('Пошук користувачів буде доступний у наступному оновленні!')">🔍 Знайти друзів</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // Ініціалізація користувача
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = `${user.first_name} ${user.last_name || ''}`;
            document.getElementById('user-avatar-placeholder').innerText = user.first_name[0];

            if (user.photo_url) {
                setAvatar(user.photo_url);
            }
        }

        // Зміна аватарки вручну
        function changeAvatar() {
            const url = prompt("Введіть посилання (URL) на нове фото:");
            if (url) {
                setAvatar(url);
            }
        }

        function setAvatar(url) {
            const img = document.getElementById('user-avatar-img');
            const placeholder = document.getElementById('user-avatar-placeholder');
            img.src = url;
            img.classList.remove('hidden');
            placeholder.classList.add('hidden');
        }

        // Перемикання теми
        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
        }

        // Перемикання вкладок
        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-feed').classList.add('hidden');
            document.getElementById('tab-friends').classList.add('hidden');

            if (tab === 'feed') {
                document.getElementById('tab-feed').classList.remove('hidden');
                event.target.classList.add('active');
            } else {
                document.getElementById('tab-friends').classList.remove('hidden');
                event.target.classList.add('active');
            }
        }

        // Публікація допису з лайками
        function createPost() {
            const text = document.getElementById('post-input').value.trim();
            if (!text) return;

            const postHtml = `
                <div class="card">
                    <b>${document.getElementById('user-name').innerText}</b>
                    <p>${text}</p>
                    <div class="post-actions">
                        <button class="action-btn" onclick="likePost(this)">❤️ <span class="like-count">0</span></button>
                    </div>
                </div>
            `;

            document.getElementById('posts-container').insertAdjacentHTML('afterbegin', postHtml);
            document.getElementById('post-input').value = '';
        }

        function likePost(btn) {
            const countSpan = btn.querySelector('.like-count');
            let count = parseInt(countSpan.innerText);
            countSpan.innerText = count + 1;
        }
    </script>
</body>
</html>
